<!DOCTYPE html>
<html>

<head>
    <title>Resume Template</title>
    <link href="../css/etemp2.css" rel="stylesheet">

</head>

<body>

    <div class="top">
                    <a href="../index.html">Home</a>
                    <a href="../html/template.html">Back</a>
                </div>

<div class="resume">

    <div class="header">

        <h1 id="name"></h1>

        <h3 id="role"></h3>

        <div class="contact">
            <span id="email"></span><br>

            <span id="phone"></span><br>

            <span id="url"></span><br>

            <span id="location"></span>

        </div>

    </div>


    <div class="section">

        <div class="title">
            SUMMARY
        </div>

        <div class="content" id="objective">

            <p id="objective">
            </p>

        </div>

    </div>



    <div class="section">

        <div class="title">
            TECHNICAL SKILLS
        </div>

        <div class="content" id="technical">

        </div>

    </div>



    <div class="section">

        <div class="title">
            SOFT SKILLS
        </div>

        <div class="content" id="softskill">

        </div>

    </div>



    <div class="section">

        <div class="title">
            EDUCATION
        </div>

        <div class="content" id="education">

        </div>

    </div>



    <div class="section">

        <div class="title">
            EXPERIENCE
        </div>

        <div class="content" id="experience">

        </div>

    </div>



    <div class="section">

        <div class="title">
            COURSE
        </div>

        <div class="content" id="course">

        </div>

    </div>



    <div class="section">

        <div class="title">
            LANGUAGE
        </div>

        <div class="content" id="language">

        </div>

    </div>



    <div class="section">

        <div class="title">
            PROJECT
        </div>

        <div class="content" id="project">

        </div>

    </div>

</div>
<button onclick="downloadResume()">Download</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="../js/etemp2.js"></script>
</body>
</html>
