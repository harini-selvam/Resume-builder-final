<!DOCTYPE html>
<html>
    <head>
        <title>Project details</title>
        <link href="../css/tracker.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet">
        <link href="../css/project.css" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="tracker" data-step="4">

    <h2>TRACKER</h2>

    <div class="step" data-number="1">
        <div class="circle">1</div>
        <span>Personal Details</span>
    </div>

    <div class="line"></div>

    <div class="step" data-number="2">
        <div class="circle">2</div>
        <span>Education</span>
    </div>

    <div class="line"></div>

    <div class="step" data-number="3">
        <div class="circle">3</div>
        <span>Skills</span>
    </div>

    <div class="line"></div>

    <div class="step" data-number="4">
        <div class="circle">4</div>
        <span>Projects</span>
    </div>

    <div class="line"></div>

    <div class="step experience-step" data-number="5">
        <div class="circle">5</div>
        <span>Experience</span>
    </div>

    <div class="line"></div>

    <div class="step" data-number="6">
        <div class="circle">6</div>
        <span>Resume</span>
    </div>

</div>
            <div class="content">
                <h2><i class="fa-solid fa-folder-open"></i>Project</h2>
                 <div class="top">
                    <a href="../index.html">Home</a>
                </div>
            <form class="myform" id="validation" onsubmit="return next(event)">
                <div class="pro">
                
                    <div class="field">
                        <label><i class="fa-solid fa-diagram-project"></i>Project name:</label>
                        <input type="text" id="proname"><br>
                    </div>
                    <div class="field">
                        <label><i class="fa-solid fa-file-lines"></i>Project description</label>
                        <textarea id="prodesc" rows="3" cols="40"
                        placeholder="--Give about Project description--"></textarea><br>
                    </div>
               
                
                    <div class="field">
                        <label><i class="fa-solid fa-gears"></i>Tools used</label>
                        <textarea id="tool" rows="3" cols="40"
                        placeholder="-About tools used-"></textarea>
                    </div>
                </div>
                    <div class="course">
                        <label><i class="fa-solid fa-certificate"></i>Course(If any):</label>
                        <textarea id="course" rows="3" cols="40"
                        placeholder="--Name of the courses--"></textarea><br>
                    </div>
                    <div class="field">
                        <br><label><i class="fa-solid fa-id-badge"></i>Job Role<span style="color:red">*</span>:</label>
                        <input type="text" id="job-role" required><br>
                    </div>
                     <div class="field">
                        <label><i class="fa-solid fa-file-lines"></i>Career Objective<span style="color:red">*</span>:</label>
                        <textarea id="obj" rows="3" cols="40"
                        placeholder="--Career Objective --" required></textarea><br>
                    </div>
            </form>
            <p><i class="fa-solid fa-lightbulb"></i>Tip: Make sure your details are correct. You can always go back and edit later.</p>
            <div>
                <button class="but1" type="button" onclick="back()"><i class="fa-solid fa-arrow-left"></i>Back</button>
                <button class="but2" type="reset"><i class="fa-solid fa-rotate-left"></i>Reset</button>
                <button class="but3" type="submit" form="validation">Next<i class="fa-solid fa-arrow-right"></i></button>
            </div>
            </div>
        </div>
        <script src="../js/tracker.js"></script>
    </body>
    <script src="../js/project.js"></script>
</html>
