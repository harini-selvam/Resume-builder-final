<!DOCTYPE html>
<html>
    <head>
        <title>Personal details</title>
        <link href="../css/tracker.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet">
        <link href="../css/personal.css" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="tracker" data-step="1">
                    <h2>TRACKER</h2>

                    <div class="step" data-number="1">
                        <div class="circle">1</div>
                        <span>Personal Details</span>
                    </div>

                    <div class="line"></div>

                    <div class="step" data-number="2">
                        <div class="circle">2</div>
                        <span>Education</span>
                    </div>

                    <div class="line"></div>

                    <div class="step" data-number="3">
                        <div class="circle">3</div>
                        <span>Skills</span>
                    </div>

                    <div class="line"></div>

                    <div class="step" data-number="4">
                        <div class="circle">4</div>
                        <span>Projects</span>
                    </div>

                    <div class="line"></div>

                    <div class="step experience-step" data-number="5">
                        <div class="circle">5</div>
                        <span>Experience</span>
                    </div>

                    <div class="line"></div>

                    <div class="step" data-number="6">
                        <div class="circle">6</div>
                        <span>Resume</span>
                    </div>

                </div>
            <div class="content">
                <h3><i class="fa-solid fa-user"></i> Personal details</h3>
                <div class="top">
                    <a href="../index.html">Home</a>
                </div>
            <form id="myform" onsubmit="return save(event)">
                <div id="row">
                    <div id="field">
                        <label><i class="fa-solid fa-user"></i>First Name<span style="color:red">*</span>:</label> 
                        <input type="text" id="fname" required><br><br>
                    </div>
                

                
                    <div id="field">
                        <label><i class="fa-solid fa-user"></i></i>Last Name<span style="color:red">*</span>:</label>
                        <input type="text" id="lname" required><br><br>
                    </div>
                </div>
                
                <div id="row">
                    <div id="field">
                        <label><i class="fa-solid fa-envelope"></i>Email address<span style="color:red">*</span>:</label>
                        <input type="email" id="mail" required><br><br>
                    </div>
               

                
                    <div id="field">
                        <label><i class="fa-solid fa-phone"></i>Phone number<span style="color:red">*</span>:</label>
                        <input type="tel" pattern="[6-9][0-9]{9}" id="num" maxlength="10" required><br><br>
                    </div>
                </div>

                <div id="row">
                    <div id="field">
                        <label><i class="fa-solid fa-link"></i>Linkedin URL:</label>
                        <input type="url" id="linkk"><br><br>
                    </div>
                
                    <div id="field">
                        <label><i class="fa-solid fa-location-pin"></i>Location<span style="color:red">*</span>:</label>
                        <input type="text" id="loc" required><br><br>
                    </div>
                </div>

                 
           
            <p><i class="fa-solid fa-lightbulb"></i>Tip:Make sure your details are correct.You can always go back and edit later</p>
            <div id="buttons">
                <button class="but2" type="reset"><i class="fa-solid fa-rotate-left"></i>Reset</button>
                <button class="but3" type="submit" >Next<i class="fa-solid fa-arrow-right"></i></button>
            </div>
            </div>
   </form>
        <script src="../js/tracker.js"></script>
    </body>
    <script src="../js/personal.js"></script> 
</html>
